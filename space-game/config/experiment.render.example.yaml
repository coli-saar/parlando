# Safe example configuration for deploying Parlando on Render.
#
# This file is intended for version control. Deployment-specific settings and
# service credentials should live in a Render secret file named
# `parlando-render.yaml`, which Render mounts at `/etc/secrets/parlando-render.yaml`.
#
# The secret include is optional so the Docker image remains runnable before the
# Render secret file has been created. The secret file deep-merges over this
# base config.

include:
  - path: /etc/secrets/parlando-render.yaml
    optional: true

experiment:
  id: render-space-game

study:
  name: Space Game
  waiting_room_timeout_seconds: 600
  reconnect_grace_seconds: 300
  session_idle_timeout_seconds: 1800
  session_max_lifetime_seconds: 14400

server:
  allowed_origins: []
  # If the frontend build is copied into the image at this path, the Rust server
  # serves it with SPA fallback. If the path is absent, API/WebSocket routes
  # still work and static serving is disabled.
  client_dist_path: /app/client-dist

direct:
  enabled: true
  participant_information_version: space-game-v1
  participant_information_url: https://example.org/studies/space-game/privacy
  consents:
    - id: study
      title: Study Consent
      body: "I agree to participate in this study."
      required: true

agents:
  mode: human_vs_human

capacity:
  max_active_sessions: 30
  max_waiting_sessions: 60
  max_unattached_participants: 120
  max_transcription_streams: 32
  storage_reserve_megabytes: 256

voice:
  enabled: false
  sample_rate_hz: 24000
  frame_duration_ms: 20
  jitter_buffer_ms: 100

speechmatics:
  realtime_url: wss://eu.rt.speechmatics.com/v2
  max_delay: 2.0
  enable_partials: true
  end_of_utterance_silence_trigger: 1.2

transcription:
  enabled: false
  provider: speechmatics
  model: enhanced
  language: en

tts:
  enabled: false
  provider: elevenlabs
  model: eleven_flash_v2_5
  output_format: pcm_24000

privacy:
  contract_version: "1"
  store_full_game_state: true
  store_typed_messages: true
  store_final_transcripts: true
  store_voice_diagnostics: false
