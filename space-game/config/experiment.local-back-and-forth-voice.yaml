experiment:
  id: local-space-game-back-and-forth-voice

includes:
  - ../../rust-server/config/experiment.voice.private.yaml

study:
  name: Space Game
  waiting_room_timeout_seconds: 600
  reconnect_grace_seconds: 300
  session_idle_timeout_seconds: 1800
  session_max_lifetime_seconds: 14400

server:
  public_base_url: http://localhost:8000
  allowed_origins: []
  client_dist_path: client/dist

direct:
  enabled: true
  consents: []

agents:
  mode: human_vs_agent
  human_vs_agent:
    factory: space_game.back_and_forth
    act_timeout_seconds: 5
    invalid_action_limit: 3
    seed: 1
    config: {}

capacity:
  max_active_sessions: 30
  max_waiting_sessions: 60
  max_unattached_participants: 120
  max_transcription_streams: 32
  storage_reserve_megabytes: 256
