experiment:
  id: local-space-game-back-and-forth-voice

includes:
  - ../../rust-server/config/experiment.livekit.private.yaml

study:
  name: Parlando Space Game Back And Forth Voice
  enabled_sources: [direct]
  waiting_room_timeout_seconds: 300
  reconnect_grace_seconds: 90

server:
  public_base_url: http://localhost:8000
  allowed_origins: []
  client_dist_path: client/dist

database:
  url: sqlite:///.local/parlando-back-and-forth-voice.sqlite

direct:
  enabled: true
  allow_room_codes: true
  require_consent: false
  consents: []

agents:
  mode: human_vs_agent
  available:
    - selector: space_game.back_and_forth
      label: Back-and-forth agent
      description: Built-in deterministic Space Game movement agent.
      requires_config: false
      default_config: {}
    - selector: remote_grpc
      label: Remote gRPC agent
      description: External agent service using the Parlando agent protocol.
      requires_config: true
      default_config:
        endpoint: http://127.0.0.1:50051
        agent_name: space-game-remote-agent
        agent_version:
  human_vs_agent:
    factory: space_game.back_and_forth
    act_timeout_seconds: 5
    invalid_action_limit: 3
    seed: 1
    config: {}

conversation:
  enabled: true
  max_history_messages: 50
