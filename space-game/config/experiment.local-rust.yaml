experiment:
  id: local-space-game

study:
  name: Space Game
  waiting_room_timeout_seconds: 600
  reconnect_grace_seconds: 300
  session_idle_timeout_seconds: 1800
  session_max_lifetime_seconds: 14400

server:
  public_base_url: http://localhost:8000
  allowed_origins: []
  client_dist_path: client/dist

direct:
  enabled: true
  consents: []

agents:
  mode: human_vs_human

capacity:
  max_active_sessions: 30
  max_waiting_sessions: 60
  max_unattached_participants: 120
  max_transcription_streams: 32
  storage_reserve_megabytes: 256

voice:
  enabled: false

transcription:
  enabled: false

tts:
  enabled: false
