# Example contents for the Render secret file `/etc/secrets/parlando-render.yaml`.
#
# In the Render Dashboard, add a Secret File named `parlando-render.yaml` and
# paste a deployment-specific copy of this YAML into it. Keep real credentials
# out of git.

experiment:
  id: YOUR_RENDER_EXPERIMENT_ID

server:
  public_base_url: https://YOUR_SERVICE.onrender.com

# Enable this block only for human-vs-agent deployments.
# agents:
#   mode: human_vs_agent
#   human_vs_agent:
#     factory: space_game.back_and_forth
#     act_timeout_seconds: 5
#     invalid_action_limit: 3
#     config: {}

# Enable these sections only for voice deployments. The browser receives the
# resulting public capability/configuration data from the server's /api/config
# and /api/rooms/{room_id}/audio-session endpoints.
livekit:
  enabled: true
  url: wss://YOUR_PROJECT.livekit.cloud
  api_key: YOUR_LIVEKIT_API_KEY
  api_secret: YOUR_LIVEKIT_API_SECRET

speechmatics:
  enabled: true
  api_key: YOUR_SPEECHMATICS_API_KEY
  realtime_url: wss://eu.rt.speechmatics.com/v2
  temporary_key_ttl_seconds: 60
  max_delay: 2.0
  enable_partials: true
  end_of_utterance_silence_trigger: 1.2

transcription:
  enabled: true
  provider: speechmatics
  model: enhanced
  language: en
  worker_autostart: true
  store_audio: false

tts:
  enabled: true
  provider: elevenlabs
  model: eleven_flash_v2_5
  voice_id: YOUR_ELEVENLABS_VOICE_ID
  voice_name: YOUR_VOICE_DISPLAY_NAME
  api_key: YOUR_ELEVENLABS_API_KEY
  output_format: pcm_16000
  worker_autostart: true
