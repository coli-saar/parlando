[package]
name = "parlando-space-game"
edition = "2021"
license = "MIT"
version = "0.1.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
# Default for this monorepo demo: use the checked-out Parlando server crate.
parlando-server = { path = "../../rust-server" }
# External games normally use the released registry package instead:
# parlando-server = "0.1.0"
# To debug a local Parlando checkout from another game repo, temporarily use
# an absolute local path and do not commit it:
# parlando-server = { path = "/absolute/path/to/parlando/rust-server" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
