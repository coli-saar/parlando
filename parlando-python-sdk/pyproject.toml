[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parlando-game-sdk"
version = "0.7.0"
description = "Python SDK for Parlando game components"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parlando_game_sdk = ["py.typed"]
