[package]
name = "parlando-game-sdk"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Rust SDK for authoring Parlando games and agents"

[dependencies]
parlando-game-derive = { path = "derive", version = "=0.7.0" }
anyhow = "1"
async-trait = "0.1"
rmp = "0.8"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.57.1"

[[example]]
name = "counter_fixture"
crate-type = ["cdylib"]
