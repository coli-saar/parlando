[package]
name = "parlando-stress-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[features]
test-traps = []

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
parlando-component-sdk = { path = "../../parlando-component-sdk" }
wit-bindgen = "0.57.1"
