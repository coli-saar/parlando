syntax = "proto3";

// The Rust remote-agent adapter and the Python SDK use this interface for one
// agent instance per assigned seat. CreateAgent returns the ID for subsequent
// callbacks. Respond distinguishes an omitted action list from an empty one,
// and an absent response lets the agent yield. Replies carry session log entries
// back to the caller that owns the session.
package parlando.agent.v5;

import "google/protobuf/struct.proto";
import "google/protobuf/duration.proto";

service AgentService {
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc Start(StartRequest) returns (ObserveResponse);
  rpc Observe(ObserveRequest) returns (ObserveResponse);
  rpc ObserveTransition(ObserveTransitionRequest) returns (ObserveResponse);
  rpc ObserveMessage(ObserveMessageRequest) returns (ObserveResponse);
  rpc Finish(FinishRequest) returns (ObserveResponse);
  rpc Respond(RespondRequest) returns (RespondResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message CreateAgentRequest {
  string role = 1;
  uint64 seed = 2;
  google.protobuf.Struct config = 3;
  // Opaque learner checkpoint selected by the experiment runner, if any.
  optional string checkpoint_id = 4;
}

message CreateAgentResponse {
  string agent_id = 1;
  repeated string session_logs = 2;
}

message StartRequest {
  string agent_id = 1;
  google.protobuf.Struct observation = 2;
}

message ObserveTransitionRequest {
  string agent_id = 1;
  string actor = 2;
  google.protobuf.Struct action = 3;
  google.protobuf.Struct observation = 4;
}

message ObserveMessageRequest {
  string agent_id = 1;
  string sender = 2;
  string text = 3;
}

message FinishRequest {
  string agent_id = 1;
  google.protobuf.Struct completion = 2;
}

// One role-safe delivery. An action and accompanying chat share one request.
message ObserveRequest {
  string agent_id = 1;
  message Transition {
    string actor = 1;
    google.protobuf.Struct action = 2;
    google.protobuf.Struct view = 3;
  }

  message Message {
    string sender = 1;
    string text = 2;
  }

  Transition transition = 2;
  Message message = 3;
}

message ObserveResponse {
  repeated string session_logs = 1;
}

message DecisionReason {
  enum Kind {
    UNSPECIFIED = 0;
    SESSION_STARTED = 1;
    AFTER_OBSERVATION = 2;
    SCHEDULED = 3;
    WAKEUP_DUE = 4;
    ACTION_REJECTED = 5;
  }
  Kind kind = 1;
  string rejection_code = 2;
}

message WakeupRequest {
  oneof request {
    google.protobuf.Duration after = 1;
    bool cancel = 2;
  }
}

message RespondRequest {
  string agent_id = 1;
  bool available_actions_provided = 2;
  repeated google.protobuf.Struct available_actions = 3;
  DecisionReason reason = 4;
}

message AgentResponse {
  optional string message = 1;
  optional google.protobuf.Struct action = 2;
  WakeupRequest wakeup = 3;
}

message RespondResponse {
  optional AgentResponse response = 1;
  repeated string session_logs = 2;
}

message ShutdownRequest {
  string agent_id = 1;
}

message ShutdownResponse {
  repeated string session_logs = 1;
}
