[package]
name = "parlando"
edition = "2021"
license = "MIT"
version = "0.3.0"
description = "Reusable Rust runtime for Parlando dialogue-game experiments."
repository = "https://github.com/coli-saar/parlando"
readme = "../README.md"
keywords = ["dialogue", "experiments", "games"]
categories = ["web-programming::http-server"]
exclude = [
    "config/*.private.yaml",
    "notes/**",
    "python/**",
    "tests/**",
]

[dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
fs2 = "0.4"
http = "1"
hmac = "0.12"
hyper = "1"
ipnet = "2"
prost = "0.13"
prost-types = "0.13"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json"] }
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tonic = { version = "0.13.1", features = ["transport", "tls-native-roots", "tls-ring"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "timeout", "trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
ratatui = { version = "0.30.2", optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[features]
internal-tools = []
stress-tui = ["internal-tools", "dep:clap", "dep:ratatui"]

[[bin]]
name = "audio-stress-tui"
path = "src/bin/audio_stress_tui.rs"
required-features = ["stress-tui"]

[[bin]]
name = "merge_sqlite_catalogues"
path = "src/bin/merge_sqlite_catalogues.rs"
required-features = ["internal-tools"]

[[test]]
name = "mock_client_smoke"
path = "tests/mock_client_smoke.rs"
required-features = ["internal-tools"]

[[test]]
name = "speechmatics_contract"
path = "tests/speechmatics_contract.rs"
required-features = ["internal-tools"]

[build-dependencies]
tonic-build = "0.13.1"
protoc-bin-vendored = "3"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
