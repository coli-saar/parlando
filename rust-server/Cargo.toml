[package]
name = "parlando-server"
edition = "2021"
license = "MIT"
version = "0.1.3"
description = "Reusable Rust server runtime for Parlando dialogue-game experiments."
repository = "https://github.com/coli-saar/parlando"
readme = "../README.md"
keywords = ["dialogue", "experiments", "games"]
categories = ["web-programming::http-server"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
http = "1"
prost = "0.13"
prost-types = "0.13"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "json"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tonic = { version = "0.12", features = ["transport"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
tower = "0.5"
