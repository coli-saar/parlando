syntax = "proto3";

package parlando.rl.v1;

import "google/protobuf/struct.proto";

// Applies idempotent training updates to learner-owned checkpoints.
service LearnerService {
  rpc Train(TrainRequest) returns (TrainResponse);
}

// Applies one runner-defined update batch to an immutable base checkpoint.
message TrainRequest {
  string update_id = 1;
  string base_checkpoint_id = 2;
  uint64 completed_epochs = 3;
  repeated TrajectoryStep steps = 4;
  google.protobuf.Struct settings = 5;
}

// Returns the new immutable checkpoint and optional scalar training diagnostics.
message TrainResponse {
  string checkpoint_id = 1;
  map<string, double> metrics = 2;
}

// Represents one role-safe action transition from the named learner.
message TrajectoryStep {
  string run_id = 1;
  string plan_id = 2;
  uint64 decision = 3;
  string scenario = 4;
  string role = 5;
  string agent = 6;
  string checkpoint_id = 7;
  string reward = 8;
  string reward_version = 9;
  google.protobuf.Value observation = 10;
  google.protobuf.Value available_actions = 11;
  google.protobuf.Value action = 12;
  bool accepted = 13;
  google.protobuf.Struct rejection = 14;
  RoleRewards rewards = 15;
  google.protobuf.Value next_observation = 16;
  bool terminal = 17;
}

// Preserves the two fixed game-role rewards without assuming zero-sum play.
message RoleRewards {
  double player_a = 1;
  double player_b = 2;
}
