syntax = "proto3";

package parlando.agent.v2;

import "google/protobuf/struct.proto";

service AgentService {
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc ObserveState(ObserveStateRequest) returns (ObserveResponse);
  rpc ObserveAction(ObserveActionRequest) returns (ObserveResponse);
  rpc ObserveMessage(ObserveMessageRequest) returns (ObserveResponse);
  rpc MaybeAct(DecisionRequest) returns (MaybeActResponse);
  rpc Act(DecisionRequest) returns (AgentResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message CreateAgentRequest {
  string protocol_version = 1;
  string agent_name = 2;
  string agent_version = 3;
  string role = 4;
  optional uint64 seed = 5;
  google.protobuf.Struct config = 6;
}

message CreateAgentResponse {
  string agent_id = 1;
}

message ObserveStateRequest {
  string agent_id = 1;
  google.protobuf.Struct current_observation = 2;
}

message ObserveActionRequest {
  string agent_id = 1;
  string actor = 2;
  google.protobuf.Struct action = 3;
  google.protobuf.Struct resulting_observation = 4;
}

enum UtteranceKind {
  UTTERANCE_KIND_UNSPECIFIED = 0;
  UTTERANCE_KIND_TYPED = 1;
  UTTERANCE_KIND_SPOKEN = 2;
  UTTERANCE_KIND_AGENT = 3;
}

message ObserveMessageRequest {
  string agent_id = 1;
  string speaker = 2;
  UtteranceKind kind = 3;
  string text = 4;
}

message ObserveResponse {}

message DecisionRequest {
  string agent_id = 1;
  bool available_actions_provided = 2;
  repeated google.protobuf.Struct available_actions = 3;
}

message AgentResponse {
  optional string message = 1;
  optional google.protobuf.Struct action = 2;
}

message MaybeActResponse {
  optional AgentResponse response = 1;
}

message ShutdownRequest {
  string agent_id = 1;
}

message ShutdownResponse {}
