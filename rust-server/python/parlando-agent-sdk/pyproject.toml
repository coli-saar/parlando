[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parlando-agent-sdk"
version = "0.1.0"
description = "Python SDK for implementing remote Parlando gRPC agents."
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.64",
    "grpcio-tools>=1.64",
    "protobuf>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parlando_agent_sdk = ["py.typed", "protos/*.proto"]
