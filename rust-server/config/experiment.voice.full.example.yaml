# Full voice-service example for Parlando games.
#
# Copy the relevant values into a generated game's private voice overlay, for
# example `config/experiment.voice.private.yaml`, or into the deployment secret
# file. Do not commit real credentials.
#
# This file intentionally documents configuration only. The Parlando Rust server
# and browser SDK own the audio relay, Speechmatics, and ElevenLabs runtime behavior.

voice:
  enabled: true
  sample_rate_hz: 24000
  frame_duration_ms: 20
  jitter_buffer_ms: 100

speechmatics:
  api_key: ${SPEECHMATICS_API_KEY}
  realtime_url: wss://eu.rt.speechmatics.com/v2
  max_delay: 2.0
  enable_partials: true
  end_of_utterance_silence_trigger: 1.2

transcription:
  enabled: true
  provider: speechmatics
  model: enhanced
  language: en
  store_audio: false

tts:
  enabled: true
  provider: elevenlabs
  model: eleven_flash_v2_5
  voice_id: ${ELEVENLABS_VOICE_ID}
  voice_name: Agent Voice
  api_key: ${ELEVENLABS_API_KEY}
  output_format: pcm_24000
  worker_autostart: true
