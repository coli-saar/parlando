[package]
name = "parlando-cue-choice-rl"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
parlando-game-sdk = { path = "../../../parlando-game-sdk" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
parlando = { path = "../../../rust-server" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[features]
agent-component = []
