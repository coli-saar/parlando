[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "parlando-cue-choice-rl"
version = "0.1.0"
description = "Mac-friendly Qwen/TorchRL learner for Parlando's cue-choice experiment"
requires-python = ">=3.11"
dependencies = [
  "grpcio>=1.83,<2",
  "parlando-agent-sdk>=0.4.0",
]

[project.optional-dependencies]
qwen = [
  "torch>=2.7",
  "torchrl==0.13.3",
  "tensordict>=0.13,<0.14",
  "transformers>=4.51,<6",
  "peft>=0.17,<1",
  "safetensors>=0.5",
]
test = ["pytest>=8", "pytest-asyncio>=0.25"]

[project.scripts]
cue-choice-learner = "cue_choice_rl.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
