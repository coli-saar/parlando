services:
  - type: web
    name: parlando-great-tree
    runtime: docker
    plan: free
    dockerfilePath: ./games/great-tree/Dockerfile
    # The image copies shared packages from the repository as well as this game.
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: RUST_LOG
        value: info
      - key: PARLANDO_DATABASE_URL
        value: sqlite:////home/parlando/parlando.sqlite
      - key: PARLANDO_CLIENT_DIST
        value: /app/client-dist
