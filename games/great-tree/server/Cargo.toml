[package]
name = "parlando-great-tree"
edition = "2021"
license = "MIT"
version = "0.1.0"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
parlando-game-sdk = { path = "../../../parlando-game-sdk" }
rand = { version = "0.8", default-features = false, features = ["std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = { version = "0.1", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
parlando = { path = "../../../rust-server", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"], optional = true }
tracing = { version = "0.1", optional = true }

[features]
bundled-agents = ["dep:async-trait", "dep:clap", "dep:parlando", "dep:tokio", "dep:tracing-subscriber", "dep:reqwest", "dep:tracing"]

[[bin]]
name = "great-tree-with-agents"
path = "src/bin/with_agents.rs"
required-features = ["bundled-agents"]

[dev-dependencies]
parlando = { path = "../../../rust-server", features = ["internal-tools"] }
serde_yaml = "0.9"

[[bin]]
name = "agent_experiment"
path = "src/bin/agent_experiment.rs"
required-features = ["bundled-agents"]
