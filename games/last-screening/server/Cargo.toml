[package]
name = "parlando-last-screening"
edition = "2021"
license = "MIT"
version = "0.1.0"
autobins = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
parlando-game-sdk = { path = "../../../parlando-game-sdk" }
rand = { version = "0.8", default-features = false, features = ["std_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive", "env"], optional = true }
parlando = { path = "../../../rust-server", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
agent-component = []
bundled-agents = ["dep:clap", "dep:parlando", "dep:tokio", "dep:tracing-subscriber"]

[[bin]]
name = "last-screening-with-agents"
path = "src/bin/with_agents.rs"
required-features = ["bundled-agents"]

[[bin]]
name = "last-screening-headless"
path = "src/bin/headless.rs"
required-features = ["bundled-agents"]
