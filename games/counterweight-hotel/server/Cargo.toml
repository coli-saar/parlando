[package]
name = "parlando-counterweight-hotel"
edition = "2021"
license = "MIT"
version = "0.1.0"

# The local SDK records representation and rule versions for dashboard replays.
[features]
local-replay = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
parlando = "=0.5.0"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
