[package]
name = "parlando-component-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust helpers for Parlando's WebAssembly game components"

[dependencies]
parlando-component-derive = { path = "derive", version = "0.1.0" }
anyhow = "1"
rmp = "0.8"
rmp-serde = "1.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
