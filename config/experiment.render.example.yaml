# Safe example configuration for deploying Parlando on Render.
#
# This file is intended for version control. Secrets are read from environment
# variables supplied by the deployment platform.

experiment:
  # Override per deployment or run with --experiment-id for a fresh evaluation id.
  id: ${PARLANDO_EXPERIMENT_ID}

study:
  name: Parlando Space Game
  enabled_sources: [direct]
  waiting_room_timeout_seconds: 300
  reconnect_grace_seconds: 90

server:
  public_base_url: ${PARLANDO_PUBLIC_BASE_URL}
  allowed_origins: []
  # If the frontend build is copied into the image at this path, the Rust server
  # serves it with SPA fallback. If the path is absent, API/WebSocket routes
  # still work and static serving is disabled.
  client_dist_path: /app/client-dist

database:
  # On Render, attach a persistent disk mounted at /data.
  url: sqlite:////data/parlando.sqlite

direct:
  enabled: true
  allow_room_codes: true
  allow_matchmaking: true
  require_consent: true
  consents:
    - id: study
      title: Study Consent
      body_html: "I agree to participate in this study."
      required: true

agents:
  mode: human_vs_human
  human_vs_agent:
    factory: space_game.back_and_forth
    act_timeout_seconds: 5
    invalid_action_limit: 3
    config: {}

livekit:
  enabled: true
  url: ${LIVEKIT_URL}
  api_key: ${LIVEKIT_API_KEY}
  api_secret: ${LIVEKIT_API_SECRET}

speechmatics:
  enabled: true
  api_key: ${SPEECHMATICS_API_KEY}
  realtime_url: wss://eu.rt.speechmatics.com/v2
  temporary_key_ttl_seconds: 60
  max_delay: 2.0
  enable_partials: true
  end_of_utterance_silence_trigger: 1.2

transcription:
  enabled: true
  provider: speechmatics
  model: enhanced
  language: en
  worker_autostart: true
  store_audio: false

tts:
  enabled: true
  provider: elevenlabs
  model: eleven_flash_v2_5
  voice_id: ${ELEVENLABS_VOICE_ID}
  voice_name: ${ELEVENLABS_VOICE_NAME}
  api_key: ${ELEVENLABS_API_KEY}
  output_format: pcm_16000
  worker_autostart: true

conversation:
  enabled: true
  max_history_messages: 50
